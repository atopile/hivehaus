substitutions: !include schedules/circuit_unified.yaml

esphome:
  name: workout
  includes:
    - schedules/workout_logic.h
  on_boot: 
    then:
      - lvgl.page.show: clock_page
      - delay: 2s
      - script.execute: time_update
      - script.execute: update_workout_display
      - delay: 1s

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

globals:
  - id: fake_hour
    type: int
    initial_value: '9'
  - id: fake_minute
    type: int
    initial_value: '29'
  - id: fake_second
    type: int
    initial_value: '0'
  - id: fake_day_of_week
    type: int
    initial_value: '1'
  - id: fake_month
    type: int
    initial_value: '1'
  - id: fake_day_of_month
    type: int
    initial_value: '1'
  - id: current_workout_idx
    type: int
    initial_value: '0'
  - id: current_circuit_idx
    type: int
    initial_value: '0'


api:
  password: ""

ota:
  - platform: esphome
    password: ""
    port: 3232

safe_mode:
  reboot_timeout: 10min

wifi:
  ssid: "atopile"
  password: "code2pcb"
  fast_connect: true
  reboot_timeout: 15min
  power_save_mode: none

  on_connect:
    then:
      - logger.log: "WiFi connected successfully"
  on_disconnect:
    then:
      - logger.log: "WiFi disconnected"

  ap:
    ssid: "Workout Fallback Hotspot"
    password: "QuxGYPMmHAe1"

captive_portal:

# WiFi status monitoring
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP"
    ssid:
      name: "WiFi SSID"
    mac_address:
      name: "WiFi MAC"


font:
  - file: 'fonts/Roboto-Regular.ttf'
    id: sans_serif
    size: 24
  - file: 'fonts/JosefinSlab-Medium.ttf'
    id: serif
    size: 24

spi:
  clk_pin: 10
  mosi_pin: 7

display:
  - id: e_display
    platform: waveshare_epaper
    cs_pin: 0
    dc_pin: 4
    data_rate: 10MHz
    busy_pin:
      number: 2
      inverted: true
    reset_pin: 3
    model: 7.50inV2
    update_interval: 2s
    auto_clear_enabled: false

color:
- id: paper_white # Really black, but will appear white on e-paper
  hex: "000000"
- id: paper_black # Really white, but will appear black on e-paper
  hex: "FFFFFF"

lvgl:
  buffer_size: 12%
  theme:
    image:
      image_recolor: paper_black
  bg_color: paper_white
  bg_opa: COVER
  default_font: sans_serif
  pages:
  - id: clock_page
    widgets:
      - obj: # clock container
          height: 280
          width: 280
          align: RIGHT_MID
          # pad_right: 16
          pad_all: 0
          border_width: 0
          bg_color: paper_white
          widgets:
            - meter: # clock face
                height: 250
                width: 250
                border_width: 0
                align: CENTER
                bg_opa: TRANSP
                text_color: paper_black
                scales:
                  - range_from: 0 # minutes scale
                    range_to: 60
                    angle_range: 360
                    rotation: 270
                    ticks:
                      width: 1
                      count: 61
                      length: 10
                      color: paper_black
                    indicators:
                      - line:
                          id: minute_hand
                          width: 3
                          color: paper_black
                          r_mod: -4
                          value: 0
                  - range_from: 1 # hours scale for labels
                    range_to: 12
                    angle_range: 330
                    rotation: 300
                    ticks:
                      width: 1
                      count: 12
                      length: 1
                      major:
                        stride: 1
                        width: 4
                        length: 10
                        color: paper_black
                        label_gap: 12
                  - range_from: 0 # hi-res hours scale for hand
                    range_to: 720
                    angle_range: 360
                    rotation: 270
                    ticks:
                      count: 0
                    indicators:
                      - line:
                          id: hour_hand
                          width: 5
                          color: paper_black
                          r_mod: -30
                          value: 0
            - label:
                id: day_label
                y: -30
            - label:
                id: date_label
                y: 30
      - obj:
          height: 300
          width: 480
          align: LEFT_MID
          pad_left: 16
          border_width: 0
          bg_color: paper_white
          layout:
            type: grid
            grid_rows: [fr(1), fr(1), fr(1), fr(1)]
            grid_columns: [120px, fr(1)]
            grid_row_align: center
            grid_column_align: center
            pad_column: 8
          widgets:
            - label:
                id: workout_title
                text: ""
                grid_cell_column_span: 2
            - label:
                id: participants_1
                text: ""
            - label:
                id: workout_1
                text: ""
            - label:
                id: participants_2
                text: ""
            - label:
                id: workout_2
                text: ""
            - label:
                id: participants_3
                text: ""
            - label:
                id: workout_3
                text: ""

interval:
  - id: time_interval
    interval: 1s
    then:
      - script.execute: fake_time_update

script:
  - id: fake_time_update
    then:
      - logger.log: "Fake time update executing"
      - globals.set:
          id: fake_second
          value: !lambda |-
            int h = id(fake_hour);
            int m = id(fake_minute);
            int s = id(fake_second);
            advance_fake_time(h, m, s, 480);
            id(fake_hour) = h;
            id(fake_minute) = m;
            return s;
      - globals.set:
          id: current_circuit_idx
          value: !lambda |-
            ScheduleConfig cfg{atoi("${c1_start_hour}"), atoi("${c1_start_minute}"),
                               atoi("${c2_start_hour}"), atoi("${c2_start_minute}"),
                               atoi("${slot_minutes}")};
            return get_circuit_idx(id(fake_hour), id(fake_minute), cfg);
      - globals.set:
          id: current_workout_idx
          value: !lambda |-
            ScheduleConfig cfg{atoi("${c1_start_hour}"), atoi("${c1_start_minute}"),
                               atoi("${c2_start_hour}"), atoi("${c2_start_minute}"),
                               atoi("${slot_minutes}")};
            return get_workout_idx(id(fake_hour), id(fake_minute), id(current_circuit_idx), cfg);
      - script.execute: time_update
      - script.execute: update_workout_display
      - logger.log: "Fake time update completed"
  - id: time_update
    then:
      - lvgl.indicator.update:
          id: minute_hand
          value: !lambda |-
            return minute_hand_value(id(fake_minute));
      - lvgl.indicator.update:
          id: hour_hand
          value: !lambda |-
            return hour_hand_value(id(fake_hour), id(fake_minute));
      - lvgl.label.update:
          id: date_label
          text: !lambda |-
            return build_date(id(fake_month), id(fake_day_of_month));
      - lvgl.label.update:
          id: day_label
          text: !lambda |-
            return build_day(id(fake_day_of_week));
  - id: update_workout_display
    then:
      - lvgl.label.update:
          id: workout_title
          text: !lambda |-
            return build_title(id(current_circuit_idx), id(current_workout_idx));
      - lvgl.label.update:
          id: participants_1
          text: !lambda |-
            return std::string(R"(${participants_1})");
      - lvgl.label.update:
          id: participants_2
          text: !lambda |-
            return std::string(R"(${participants_2})");
      - lvgl.label.update:
          id: participants_3
          text: !lambda |-
            return std::string(R"(${participants_3})");
      - lvgl.label.update:
          id: workout_1
          text: !lambda |-
            return std::string(get_workout_name(
              id(current_circuit_idx), id(current_workout_idx),
              R"(${circuit1_w1})", R"(${circuit1_w2})", R"(${circuit1_w3})",
              R"(${circuit2_w1})", R"(${circuit2_w2})", R"(${circuit2_w3})"));
      - lvgl.label.update:
          id: workout_2
          text: !lambda |-
            return std::string(get_workout_name(
              id(current_circuit_idx), (id(current_workout_idx) + 1) % 3,
              R"(${circuit1_w1})", R"(${circuit1_w2})", R"(${circuit1_w3})",
              R"(${circuit2_w1})", R"(${circuit2_w2})", R"(${circuit2_w3})"));
      - lvgl.label.update:
          id: workout_3
          text: !lambda |-
            return std::string(get_workout_name(
              id(current_circuit_idx), (id(current_workout_idx) + 2) % 3,
              R"(${circuit1_w1})", R"(${circuit1_w2})", R"(${circuit1_w3})",
              R"(${circuit2_w1})", R"(${circuit2_w2})", R"(${circuit2_w3})"));
